<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FloussTrack</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f172a'/><text y='65' x='50' font-size='50' text-anchor='middle'>💰</text></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #151f32;
      --card-border: #23324d;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --purple: #8b5cf6;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px 16px 80px 16px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-top: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981, #047857);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      color: #fff;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-export {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .alert-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      font-size: 13px;
      font-weight: 600;
      align-items: center;
      gap: 10px;
    }
    .alert-banner.show {
      display: flex;
    }
    .alert-banner.day {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.5);
      color: #fbbf24;
    }
    .alert-banner.week {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px;
      position: relative;
      transition: all 0.3s;
    }

    .stat-card.alert-active {
      border-color: var(--danger);
      background: linear-gradient(180deg, var(--card-bg) 0%, rgba(239, 68, 68, 0.08) 100%);
    }

    .stat-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .stat-limit {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .form-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .amount-box {
      position: relative;
      margin-bottom: 10px;
    }

    .amount-input {
      width: 100%;
      background: #0f172a;
      border: 2px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 60px 12px 14px;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      outline: none;
    }

    .amount-input:focus {
      border-color: var(--accent);
    }

    .currency-tag {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .quick-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .chip {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 7px 12px;
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .input-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 11px 14px;
      color: #fff;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .toggle-label {
      font-size: 13px;
      font-weight: 600;
    }

    .toggle-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--purple);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .cats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .cat-btn {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .cat-btn.selected {
      border-color: var(--accent);
      background: rgba(16, 185, 129, 0.15);
    }

    .cat-btn.is-monthly.selected {
      border-color: var(--purple);
      background: rgba(139, 92, 246, 0.15);
    }

    .cat-icon {
      font-size: 20px;
    }

    .cat-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }

    .cat-tag {
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(139, 92, 246, 0.2);
      color: #c4b5fd;
      margin-top: 2px;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #042f1a;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

      font-size:
